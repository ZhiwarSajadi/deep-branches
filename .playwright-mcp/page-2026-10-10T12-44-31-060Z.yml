  - dialog [ref=f4e345]:
    - generic [ref=f4e346]:
      - button "Close" [active] [ref=f4e347] [cursor=pointer]
      - heading "About Deep Branches" [level=2] [ref=f4e351]
      - paragraph [ref=f4e352]: "Hominin Tree 3D: the human family tree"
      - generic [ref=f4e353]:
        - heading "What you are looking at" [level=3] [ref=f4e354]
        - paragraph [ref=f4e355]: Deep Branches is an interactive 3D map of the human family tree. Each bar is a hominin species, stretched across the time it is known from the fossil record (Ma = million years ago, ka = thousand years ago). Press play, drag the timeline, or click a species to read a short summary and see its sources. Double-click a species to step inside its bar and look around in first-person view.
        - paragraph [ref=f4e356]: Solid lines are supported links between species. Dashed lines mark links whose ancestry is debated.
      - generic [ref=f4e357]:
        - heading "A simplified picture, not a settled one" [level=3] [ref=f4e358]
        - paragraph [ref=f4e359]: "Researchers disagree about which fossils belong to which species, how many species there are, and how they are related. Real evolution looked more like a braided stream than a clean tree: populations split, merged and interbred (many living people carry small amounts of Neanderthal DNA, and some populations carry Denisovan DNA). The dates and relationships shown follow the sources linked on each card and will need revising as new fossils and methods appear."
      - generic [ref=f4e360]:
        - heading "Accuracy and AI assistance" [level=3] [ref=f4e361]
        - paragraph [ref=f4e362]: The summaries were drafted with the help of AI and curated by the project’s author. They have not been peer reviewed unless stated otherwise, and they may contain mistakes or oversimplifications. For anything that matters (homework, citations, publications) please check the primary sources linked on each card.
      - generic [ref=f4e363]:
        - heading "Author & code" [level=3] [ref=f4e364]
        - paragraph [ref=f4e365]:
          - text: Created by
          - link "Zhiwar Sajadi" [ref=f4e366] [cursor=pointer]:
            - /url: https://github.com/ZhiwarSajadi
          - text: . Project code and updates are available on GitHub.
      - generic [ref=f4e369]:
        - heading "Free and non-commercial" [level=3] [ref=f4e370]
        - paragraph [ref=f4e371]: Deep Branches is a free, non-commercial educational project made by an individual as a personal project. It has no ads, no sponsors, no affiliate links, no paywalls and no accounts, and nothing is for sale.
      - generic [ref=f4e372]:
        - heading "Privacy" [level=3] [ref=f4e373]
        - paragraph [ref=f4e374]: This site does not use cookies, analytics or third-party trackers, and its fonts and code are served from the same place as the page itself. Like any website, the service that hosts it may keep standard technical logs (such as IP addresses) outside the author’s control. Links on the cards lead to other websites that have their own policies.
