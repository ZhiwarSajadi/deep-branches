    - list [ref=f4e54]:
      - listitem:
        - heading "Pan troglodytes" [level=3]
        - paragraph: Chimpanzee line · 7.3 Ma → present · Equatorial Africa
        - paragraph: Our closest living relatives. Our genomes are ~98.8% identical in the DNA that can be aligned; counting stretches that cannot be aligned, the gap is larger.
        - list [ref=f4e56]:
          - listitem:
            - link "Chimpanzee Sequencing Consortium 2005, Nature" [ref=f4e57] [cursor=pointer]:
              - /url: https://doi.org/10.1038/nature04072
      - listitem:
        - heading "Sahelanthropus tchadensis" [level=3]
        - paragraph: Basal hominins · 7.2 Ma – 6.8 Ma · Chad
        - paragraph: "The ‘Toumaï’ skull (~7 Ma): one of the oldest candidate hominins. Whether it walked upright is still contested: a 2022 femur study and a 2025 reanalysis say yes, another 2025 study says no."
        - list [ref=f4e59]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e60] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/sahelanthropus-tchadensis
          - listitem:
            - link "Brunet et al. 2002, Nature" [ref=f4e61] [cursor=pointer]:
              - /url: https://doi.org/10.1038/nature00879
          - listitem:
            - link "Daver et al. 2022, Nature (femur)" [ref=f4e62] [cursor=pointer]:
              - /url: https://doi.org/10.1038/s41586-022-04901-z
          - listitem:
            - link "Williams et al. 2025, Science Advances" [ref=f4e63] [cursor=pointer]:
              - /url: https://doi.org/10.1126/sciadv.adv0130
          - listitem:
            - 'link "Max Planck: Cazenave et al. 2025 (bipedalism disputed)" [ref=f4e64] [cursor=pointer]':
              - /url: https://www.mpg.de/22183908/what-about-bipedalism-in-sahelanthropus
      - listitem:
        - heading "Orrorin tugenensis" [level=3]
        - paragraph: Basal hominins · 6.2 Ma – 5.8 Ma · Tugen Hills, Kenya
        - paragraph: Its thigh bone hints at walking upright.
        - list [ref=f4e66]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e67] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/orrorin-tugenensis
      - listitem:
        - heading "Ardipithecus kadabba" [level=3]
        - paragraph: Basal hominins · 5.8 Ma – 5.2 Ma · Middle Awash, Ethiopia
        - paragraph: Toe bones suggest an early bipedal stride.
        - list [ref=f4e69]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e70] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/ardipithecus-kadabba
          - listitem:
            - link "Haile-Selassie 2001, Nature" [ref=f4e71] [cursor=pointer]:
              - /url: https://doi.org/10.1038/35084063
      - listitem:
        - heading "Ardipithecus ramidus" [level=3]
        - paragraph: Basal hominins · 4.5 Ma – 4.3 Ma · Aramis, Ethiopia
        - paragraph: "‘Ardi’: a partial skeleton that walked and climbed."
        - list [ref=f4e73]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e74] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/ardipithecus-ramidus
          - listitem:
            - link "White et al. 2009, Science" [ref=f4e75] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.1175802
      - listitem:
        - heading "Australopithecus anamensis" [level=3]
        - paragraph: Australopiths · 4.2 Ma – 3.8 Ma · Kenya & Ethiopia
        - paragraph: A near‑complete skull found in 2016 put a face to the name.
        - list [ref=f4e77]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e78] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-anamensis
          - listitem:
            - link "Leakey et al. 1995, Nature" [ref=f4e79] [cursor=pointer]:
              - /url: https://doi.org/10.1038/376565a0
      - listitem:
        - heading "Australopithecus afarensis" [level=3]
        - paragraph: Australopiths · 3.9 Ma – 2.9 Ma · Hadar, Ethiopia
        - paragraph: Home of ‘Lucy’ and the Laetoli footprints.
        - list [ref=f4e81]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e82] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-afarensis
      - listitem:
        - heading "Australopithecus prometheus" [level=3]
        - paragraph: Australopiths · 3.7 Ma – 3.6 Ma · Sterkfontein, South Africa · Ancestry debated
        - paragraph: A name proposed for ‘Little Foot’ (StW 573, ~3.67 Ma), the most complete australopith skeleton. A 2025 study found it fits neither A. prometheus (type specimen MLD 1) nor A. africanus, so it may be an unnamed species.
        - list [ref=f4e84]:
          - listitem:
            - link "Martin et al. 2025, Am. J. Biol. Anthropol." [ref=f4e85] [cursor=pointer]:
              - /url: https://doi.org/10.1002/ajpa.70177
          - listitem:
            - link "Granger et al. 2015, Nature (3.67 Ma date)" [ref=f4e86] [cursor=pointer]:
              - /url: https://doi.org/10.1038/nature14268
      - listitem:
        - heading "Australopithecus bahrelghazali" [level=3]
        - paragraph: Australopiths · 3.6 Ma – 3 Ma · Koro Toro, Chad · Ancestry debated
        - paragraph: "‘Abel’: the first australopith found west of the Rift Valley."
        - list [ref=f4e88]:
          - listitem:
            - link "Brunet et al. 1995, Nature (discovery in Chad)" [ref=f4e89] [cursor=pointer]:
              - /url: https://doi.org/10.1038/378273a0
      - listitem:
        - heading "Kenyanthropus platyops" [level=3]
        - paragraph: Australopiths · 3.5 Ma – 3.3 Ma · Lake Turkana, Kenya · Ancestry debated
        - paragraph: A flat‑faced contemporary of Lucy; whether it deserves its own genus is debated.
        - list [ref=f4e91]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e92] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/kenyanthropus-platyops
          - listitem:
            - link "Leakey et al. 2001, Nature" [ref=f4e93] [cursor=pointer]:
              - /url: https://doi.org/10.1038/35068500
      - listitem:
        - heading "Australopithecus deyiremeda" [level=3]
        - paragraph: Australopiths · 3.5 Ma – 3.3 Ma · Woranso‑Mille, Ethiopia · Ancestry debated
        - paragraph: "Shared the landscape with Lucy’s species. In 2025 the grasping Burtele foot was assigned to it: a tree‑climber living beside Lucy."
        - list [ref=f4e95]:
          - listitem:
            - link "Haile-Selassie et al. 2025, Nature (Burtele foot)" [ref=f4e96] [cursor=pointer]:
              - /url: https://doi.org/10.1038/s41586-025-09714-4
          - listitem:
            - link "Haile-Selassie et al. 2015, Nature" [ref=f4e97] [cursor=pointer]:
              - /url: https://doi.org/10.1038/nature14448
      - listitem:
        - heading "Australopithecus africanus" [level=3]
        - paragraph: Australopiths · 3.4 Ma – 2.1 Ma · South Africa
        - paragraph: "The Taung Child (found 1924, named 1925): the first australopith ever named. Its South African caves are dated 2.6–2.0 Ma by older methods, but ~3.4–3.6 Ma by 2022 cosmogenic dating."
        - list [ref=f4e99]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e100] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-africanus
          - listitem:
            - link "Dart 1925, Nature (Taung Child)" [ref=f4e101] [cursor=pointer]:
              - /url: https://doi.org/10.1038/115195a0
          - listitem:
            - link "Granger et al. 2022 (cosmogenic dating of Sterkfontein)" [ref=f4e102] [cursor=pointer]:
              - /url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9271183/
      - listitem:
        - heading "Paranthropus aethiopicus" [level=3]
        - paragraph: Paranthropus · 2.7 Ma – 2.3 Ma · West Turkana, Kenya
        - paragraph: The ‘Black Skull’, stained dark by manganese.
        - list [ref=f4e104]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e105] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/paranthropus-aethiopicus
      - listitem:
        - heading "Australopithecus garhi" [level=3]
        - paragraph: Australopiths · 2.6 Ma – 2.4 Ma · Bouri, Ethiopia · Ancestry debated
        - paragraph: "Found near butchered animal bones: an early tool user?"
        - list [ref=f4e107]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e108] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-garhi
          - listitem:
            - link "Asfaw et al. 1999, Science" [ref=f4e109] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.284.5414.629
      - listitem:
        - heading "Homo habilis" [level=3]
        - paragraph: Genus Homo · 2.4 Ma – 1.4 Ma · Olduvai Gorge, Tanzania · Ancestry debated
        - paragraph: ‘Handy man’, named for the stone tools found with it at Olduvai. Oldowan-style tools are now known from ~2.6 Ma, and the oldest fossil assigned to Homo is a ~2.8 Ma jaw from Ledi-Geraru, Ethiopia.
        - list [ref=f4e111]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e112] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-habilis
          - listitem:
            - link "Leakey, Tobias & Napier 1964, Nature" [ref=f4e113] [cursor=pointer]:
              - /url: https://doi.org/10.1038/202007a0
          - listitem:
            - link "Braun et al. 2019, PNAS (2.6 Ma Oldowan tools)" [ref=f4e114] [cursor=pointer]:
              - /url: https://doi.org/10.1073/pnas.1820177116
          - listitem:
            - 'link "National Geographic: 2.8 Ma Ledi-Geraru jaw" [ref=f4e115] [cursor=pointer]':
              - /url: https://www.nationalgeographic.com/science/article/150304-homo-habilis-evolution-fossil-jaw-ethiopia-olduvai-gorge
      - listitem:
        - heading "Homo rudolfensis" [level=3]
        - paragraph: Genus Homo · 2.4 Ma – 1.8 Ma · Koobi Fora, Kenya · Ancestry debated
        - paragraph: Bigger‑brained, flatter‑faced early Homo, known from the Lake Turkana basin.
        - list [ref=f4e117]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e118] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-rudolfensis
      - listitem:
        - heading "Paranthropus boisei" [level=3]
        - paragraph: Paranthropus · 2.3 Ma – 1.4 Ma · Olduvai Gorge, Tanzania · Ancestry debated
        - paragraph: "‘Nutcracker Man’: huge molars, mostly grass and sedges."
        - list [ref=f4e120]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e121] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/paranthropus-boisei
      - listitem:
        - heading "Paranthropus robustus" [level=3]
        - paragraph: Paranthropus · 2.04 Ma – 1 Ma · Swartkrans, South Africa · Ancestry debated
        - paragraph: Massive jaws built for tough foods.
        - list [ref=f4e123]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e124] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/paranthropus-robustus
      - listitem:
        - heading "Homo erectus" [level=3]
        - paragraph: Genus Homo · 2.04 Ma – 110k · Africa, Asia, Europe
        - paragraph: The first to walk out of Africa, all the way to Java. Drimolen fossils (DNH 134, DNH 127) push its debut to ~2 Ma in South Africa.
        - list [ref=f4e126]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e127] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-erectus
      - listitem:
        - heading "Australopithecus sediba" [level=3]
        - paragraph: Australopiths · 1.98 Ma – 1.95 Ma · Malapa, South Africa · Ancestry debated
        - paragraph: Ape‑like arms and a human‑like pelvis, found in a cave in 2008 and dated to ~1.98 Ma.
        - list [ref=f4e129]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e130] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-sediba
          - listitem:
            - link "Berger et al. 2010, Science" [ref=f4e131] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.1184944
      - listitem:
        - heading "Homo ergaster" [level=3]
        - paragraph: Genus Homo · 1.8 Ma – 1.3 Ma · Lake Turkana, Kenya · Ancestry debated
        - paragraph: "‘Turkana Boy’: tall and long‑legged. Often treated as African H. erectus."
        - list [ref=f4e133]:
          - listitem:
            - 'link "Smithsonian Human Origins Program: Homo erectus" [ref=f4e134] [cursor=pointer]':
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-erectus
          - listitem:
            - link "Brown et al. 1985, Nature (Turkana Boy)" [ref=f4e135] [cursor=pointer]:
              - /url: https://doi.org/10.1038/316788a0
      - listitem:
        - heading "Paranthropus capensis" [level=3]
        - paragraph: Paranthropus · 1.4 Ma – 1.3 Ma · Swartkrans, South Africa · Ancestry debated
        - paragraph: "Proposed 2025: the SK 15 jaw (~1.4 Ma, the only known specimen) reclassified as a small, gracile Paranthropus. Contested in 2026, with other classifications suggested."
        - list [ref=f4e137]:
          - listitem:
            - link "Zanolli et al. 2025, J. Human Evolution" [ref=f4e138] [cursor=pointer]:
              - /url: https://doi.org/10.1016/j.jhevol.2024.103634
          - listitem:
            - link "Clarke & Pickering 2026, Trans. Royal Society of South Africa (rebuttal)" [ref=f4e139] [cursor=pointer]:
              - /url: https://doi.org/10.1080/0035919X.2026.2625163
      - listitem:
        - heading "Homo antecessor" [level=3]
        - paragraph: Genus Homo · 1.2 Ma – 800k · Atapuerca, Spain · Ancestry debated
        - paragraph: Among the earliest humans in Western Europe, from Atapuerca. Enamel proteins (2020) place it as a close sister lineage to the later Homo of Neanderthals, Denisovans and us.
        - list [ref=f4e141]:
          - listitem:
            - link "Bermúdez de Castro et al. 1997, Science" [ref=f4e142] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.276.5317.1392
          - listitem:
            - link "Welker et al. 2020, Nature (enamel proteome)" [ref=f4e143] [cursor=pointer]:
              - /url: https://doi.org/10.1038/s41586-020-2153-8
      - listitem:
        - heading "Homo heidelbergensis" [level=3]
        - paragraph: Genus Homo · 700k – 200k · Africa & Europe · Ancestry debated
        - paragraph: Long seen as the last shared ancestor of us and Neanderthals, and drawn that way here. But 2025 analyses date the splits between the sapiens, Neanderthal and Denisovan lineages to over 1 Ma, well before this species.
        - list [ref=f4e145]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e146] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-heidelbergensis
          - listitem:
            - link "Feng et al. 2025, Science (Yunxian)" [ref=f4e147] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.ado9202
      - listitem:
        - heading "Homo rhodesiensis" [level=3]
        - paragraph: Genus Homo · 600k – 200k · Kabwe, Zambia & Bodo, Ethiopia · Ancestry debated
        - paragraph: "African Middle Pleistocene humans (Kabwe ‘Broken Hill’ skull, 1921). The 2021 replacement name H. bodoensis is disputed: critics say it is a junior synonym of H. rhodesiensis under ICZN priority rules, while its authors disagree."
        - list [ref=f4e149]:
          - listitem:
            - link "Delson & Stringer 2022, Evolutionary Anthropology (H. bodoensis rejected)" [ref=f4e150] [cursor=pointer]:
              - /url: https://doi.org/10.1002/evan.21950
          - listitem:
            - link "Roksandic et al. 2022, Evolutionary Anthropology (H. bodoensis proposal)" [ref=f4e151] [cursor=pointer]:
              - /url: https://doi.org/10.1002/evan.21929
          - listitem:
            - link "Roksandic et al. 2022, Evolutionary Anthropology (reply)" [ref=f4e152] [cursor=pointer]:
              - /url: https://doi.org/10.1002/evan.21954
      - listitem:
        - heading "Homo neanderthalensis" [level=3]
        - paragraph: Genus Homo · 400k – 40k · Europe & West Asia · Ancestry debated
        - paragraph: Likely buried at least some of their dead, though this is still debated. Many of us still carry their DNA.
        - list [ref=f4e154]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f4e155] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-neanderthalensis
          - listitem:
            - link "Green et al. 2010, Science (genome)" [ref=f4e156] [cursor=pointer]:
              - /url: https://doi.org/10.1126/science.1188021
          - listitem:
