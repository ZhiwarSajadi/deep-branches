      - listitem:
        - heading "Homo longi" [level=3]
        - paragraph: Genus Homo · 300k – 40k · Siberia, Tibet & East Asia · Ancestry debated
        - paragraph: "The Denisovans: in 2025 ancient proteins and DNA linked the Harbin ‘Dragon Man’ skull to them, so H. longi has been proposed as their species name (some researchers prefer the informal ‘Denisovans’). Proteins also tie the Penghu jaw from Taiwan to them. The ~1 Ma Yunxian skull belongs to the same clade; a rival name, H. juluensis (2024), is not widely used."
