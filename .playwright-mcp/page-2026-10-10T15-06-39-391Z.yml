              - /url: https://doi.org/10.1126/science.ads3888
      - listitem:
        - heading "Homo sapiens" [level=3]
        - paragraph: Genus Homo · 300k → present · Morocco → everywhere · Ancestry debated
        - paragraph: Us. Oldest known fossils from Jebel Irhoud.
        - list [ref=f5e175]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e176] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-sapiens
