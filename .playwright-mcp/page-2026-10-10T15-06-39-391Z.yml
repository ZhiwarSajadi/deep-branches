            - link "Hublin et al. 2017, Nature (Jebel Irhoud)" [ref=f5e177] [cursor=pointer]:
              - /url: https://doi.org/10.1038/nature22336
      - listitem:
        - heading "Homo sp. (Nesher Ramla)" [level=3]
        - paragraph: Genus Homo · 140k – 120k · Nesher Ramla, Israel · Ancestry debated
        - paragraph: "‘Nesher Ramla Homo’: an informal group, not a formally named species, of Middle Pleistocene humans from Israel. Neanderthal‑like jaws and teeth, archaic skull. Possibly late survivors of a Levantine lineage that fed into Neanderthals and Asian Homo."
