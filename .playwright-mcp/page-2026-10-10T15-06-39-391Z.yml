              - /url: https://ro.uow.edu.au/smhpapers/2937
      - listitem:
        - heading "Homo naledi" [level=3]
        - paragraph: Genus Homo · 335k – 236k · Rising Star Cave, South Africa · Ancestry debated
        - paragraph: Small‑brained, yet it lived alongside early Homo sapiens in southern Africa. Claims that it buried its dead and made cave engravings were peer‑published in 2025 but remain contested.
        - list [ref=f5e160]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e161] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/homo-naledi
