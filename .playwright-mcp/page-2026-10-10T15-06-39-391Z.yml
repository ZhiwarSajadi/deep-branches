              - /url: https://doi.org/10.1126/science.ado9202
          - listitem:
            - link "Bae & Wu 2024, Nature Communications (H. juluensis)" [ref=f5e168] [cursor=pointer]:
              - /url: https://doi.org/10.1038/s41467-024-53918-7
          - listitem:
            - link "Ni et al. 2021, The Innovation" [ref=f5e169] [cursor=pointer]:
              - /url: https://doi.org/10.1016/j.xinn.2021.100132
          - listitem:
            - link "Fu et al. 2025, Cell (Harbin = Denisovan)" [ref=f5e170] [cursor=pointer]:
              - /url: https://www.cell.com/cell/fulltext/S0092-8674(25)00627-0
