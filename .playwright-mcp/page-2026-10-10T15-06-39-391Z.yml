      - listitem:
        - heading "Australopithecus anamensis" [level=3]
        - paragraph: Australopiths · 4.2 Ma – 3.8 Ma · Kenya & Ethiopia
        - paragraph: A near‑complete skull found in 2016 put a face to the name.
        - list [ref=f5e77]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e78] [cursor=pointer]:
