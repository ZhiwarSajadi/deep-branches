              - /url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9271183/
      - listitem:
        - heading "Paranthropus aethiopicus" [level=3]
        - paragraph: Paranthropus · 2.7 Ma – 2.3 Ma · West Turkana, Kenya
        - paragraph: The ‘Black Skull’, stained dark by manganese.
        - list [ref=f5e104]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e105] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/paranthropus-aethiopicus
      - listitem:
        - heading "Australopithecus garhi" [level=3]
        - paragraph: Australopiths · 2.6 Ma – 2.4 Ma · Bouri, Ethiopia · Ancestry debated
        - paragraph: "Found near butchered animal bones: an early tool user?"
        - list [ref=f5e107]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e108] [cursor=pointer]:
              - /url: https://humanorigins.si.edu/evidence/human-fossils/species/australopithecus-garhi
