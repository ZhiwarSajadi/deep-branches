              - /url: https://www.mpg.de/22183908/what-about-bipedalism-in-sahelanthropus
      - listitem:
        - heading "Orrorin tugenensis" [level=3]
        - paragraph: Basal hominins · 6.2 Ma – 5.8 Ma · Tugen Hills, Kenya
        - paragraph: Its thigh bone hints at walking upright.
        - list [ref=f5e66]:
          - listitem:
            - link "Smithsonian Human Origins Program" [ref=f5e67] [cursor=pointer]:
